name: Fetch job boards

on:
  schedule:
    - cron: "40 4 * * 1-5"   # 06:40 Madrid in summer, 05:40 in winter, before the 07:23 radar run
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-job-boards
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch boards
        run: python fetch_jobs.py
      - name: Commit results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update job boards $(date -u +%Y-%m-%d)"
            git push
          fi
