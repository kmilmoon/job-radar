name: Fetch job boards

on:
  schedule:
    - cron: "45 3 * * 1-5"   # 05:45 Madrid in summer, 04:45 in winter, before the 06:21 radar run
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["companies.json", "fetch_jobs.py", "aggregators.py", "triggers.py", "tools/check_urls.py", "data/to_check.json", ".github/workflows/fetch.yml"]

permissions:
  contents: write

concurrency:
  group: fetch-job-boards
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch boards
        run: python fetch_jobs.py
      - name: Vía B triggers (weekly and monthly parts decide by date)
        run: python triggers.py
        continue-on-error: true
      - name: Check that offers are still open
        run: python tools/check_urls.py
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update job boards $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          fi
