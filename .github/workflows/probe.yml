name: Probe sources
on:
  push:
    branches: [main]
    paths: ["tools/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/probe.py
      - run: |
          git config user.name "job-radar-bot"; git config user.email "job-radar-bot@users.noreply.github.com"
          git add data/probe.json; git commit -m "Probe sources" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
